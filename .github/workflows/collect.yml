name: Collecte quotidienne
on:
  schedule:
    - cron: "10 07 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collecte
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quota eBay avant
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: |
          python - <<'PYEOF'
          import os, json, base64, urllib.request, urllib.parse
          raw = f"{os.environ['EBAY_APP_ID']}:{os.environ['EBAY_CERT_ID']}".encode()
          h = {"Authorization": "Basic " + base64.b64encode(raw).decode(), "Content-Type": "application/x-www-form-urlencoded"}
          b = urllib.parse.urlencode({"grant_type": "client_credentials", "scope": "https://api.ebay.com/oauth/api_scope"}).encode()
          t = json.load(urllib.request.urlopen(urllib.request.Request("https://api.ebay.com/identity/v1/oauth2/token", b, h)))["access_token"]
          r = json.load(urllib.request.urlopen(urllib.request.Request("https://api.ebay.com/developer/analytics/v1_beta/rate_limit/?api_context=buy&api_name=browse", headers={"Authorization": "Bearer " + t})))
          for a in r.get("rateLimits", []):
              for s in a.get("resources", []):
                  for x in s.get("rates", []):
                      print("QUOTA eBay", s.get("name"), ": utilisé", x.get("count"), "/", x.get("limit"), "- reste", x.get("remaining"), "- remise à zéro", x.get("reset"))
          PYEOF
      - name: Collecte
        run: python collect.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
      - name: Sauvegarde des données
        run: |
          git config user.name "collecte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée."
            exit 0
          fi
          git commit -m "données $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Essai $i échoué, nouvel essai dans 10 s..."
            sleep 10
          done
          exit 1
      - name: Quota eBay après
        if: always()
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: |
          python - <<'PYEOF'
          import os, json, base64, urllib.request, urllib.parse
          raw = f"{os.environ['EBAY_APP_ID']}:{os.environ['EBAY_CERT_ID']}".encode()
          h = {"Authorization": "Basic " + base64.b64encode(raw).decode(), "Content-Type": "application/x-www-form-urlencoded"}
          b = urllib.parse.urlencode({"grant_type": "client_credentials", "scope": "https://api.ebay.com/oauth/api_scope"}).encode()
          t = json.load(urllib.request.urlopen(urllib.request.Request("https://api.ebay.com/identity/v1/oauth2/token", b, h)))["access_token"]
          r = json.load(urllib.request.urlopen(urllib.request.Request("https://api.ebay.com/developer/analytics/v1_beta/rate_limit/?api_context=buy&api_name=browse", headers={"Authorization": "Bearer " + t})))
          for a in r.get("rateLimits", []):
              for s in a.get("resources", []):
                  for x in s.get("rates", []):
                      print("QUOTA eBay", s.get("name"), ": utilisé", x.get("count"), "/", x.get("limit"), "- reste", x.get("remaining"), "- remise à zéro", x.get("reset"))
          PYEOF
