<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À sonder - TIK-KOT</title>
<style>
:root{--bg:#0d0f14;--fg:#f2f3f7;--mut:#a3a9bd;--card:#171a22;--line:#2a2f3d;--acc:#ffb020}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0;padding:14px}
header,.list{max-width:940px;margin:0 auto 12px}
header{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h1{margin:0 0 6px;font-size:21px;color:var(--acc)}
.sub{font-size:13px;color:var(--mut)}
.ctl{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--mut)}
.ctl label{display:flex;align-items:center;gap:6px}
input[type=number],select{background:var(--bg);color:var(--fg);border:1px solid var(--mut);border-radius:6px;padding:5px 8px;font-size:14px}
input[type=number]{width:70px}
button{border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:13px}
.b1{background:var(--acc);color:#111}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.row.none{opacity:.4}
.row.fav{border-color:var(--acc)}
.tl{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none}
.inf{flex:1;min-width:180px}
.gt{font-weight:700;font-size:16px}
.mt{font-size:12px;color:var(--mut)}
.pr{font-weight:800;font-size:17px;color:var(--acc);white-space:nowrap;text-align:right}
.pr small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.act{display:flex;gap:6px;flex-wrap:wrap}
a.sb{color:#fff;text-decoration:none;font-weight:800;font-size:13px;border-radius:8px;padding:8px 11px;text-align:center;line-height:1.1}
a.sb small{display:block;font-size:10px;font-weight:600}
.lbc{background:#ff6e14}.vin{background:#09b1ba}
.no{background:#444;color:#fff}.ok{background:#1f9d55;color:#fff}
.empty{text-align:center;padding:30px;color:var(--mut)}
#al{display:none;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
#al pre{white-space:pre-wrap;margin:8px 0;font-family:inherit}
</style></head><body>
<header>
<h1>🔍 À sonder</h1>
<div class="sub">Seuls les jeux de rang A/S dont le prix est fiable (≥ 3 annonces) sont montrés. Ouvre LBC/Vinted : si rien, clique <b>Rien trouvé</b> (le jeu disparaît 7 jours). Si une affaire existe, clique <b>Intéressant</b>.</div>
<div class="ctl">
<label>Mode <select id="md"><option value="s">À sonder (A/S, ≥ 3 annonces)</option><option value="t">Tous les jeux (valeur mini ci-dessous)</option></select></label>
<label>Valeur mini <input type="number" id="mn" value="40" step="5"> €</label>
<label>Console <select id="cs"><option value="">Toutes</option></select></label>
<label><input type="checkbox" id="fm"> 🕵 Méconnus seulement</label>
<label><input type="checkbox" id="sg"> Montrer les « rien trouvé »</label>
<label>Prix max = <input type="number" id="bg" value="60" min="10" max="100" step="5"> % du prix eBay</label>
<button class="b1" id="alb">🔔 Liste d'alertes à créer</button>
<span>Jeux : <b id="ct" style="color:var(--fg)">0</b></span>
</div></header>
<div class="list"><div id="al"></div><div id="ls"><div class="empty">Chargement…</div></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CART=new Set(["nes","snes","n64","gb","gbc","gba","md","ds","3ds"]);
const KEYS=["ps1","ps2","ps3","ps4","psp","gc","xbox","x360","xone","switch","wii","ds","3ds","gba","gbc","gb","n64","snes","nes","md","dc","saturn"];
const CN={ps1:"PlayStation 1",ps2:"PlayStation 2",ps3:"PlayStation 3",ps4:"PlayStation 4",psp:"PSP",gc:"Gamecube",xbox:"Xbox",x360:"Xbox 360",xone:"Xbox One",switch:"Nintendo Switch",wii:"Nintendo Wii",ds:"Nintendo DS","3ds":"Nintendo 3DS",gba:"Game Boy Advance",gbc:"Game Boy Color",gb:"Game Boy",n64:"Nintendo 64",snes:"Super Nintendo",nes:"NES",md:"Mega Drive",dc:"Dreamcast",saturn:"Sega Saturn"};
const DEF=[{k:"D",t:10,c:"#ffffff"},{k:"C",t:15,c:"#ffd23f"},{k:"B",t:25,c:"#ff8a1f"},{k:"A",t:50,c:"#e5383b"},{k:"S",t:100,c:"#9b5de5"}];
let TI=DEF;try{const s=JSON.parse(localStorage.getItem("tikkot_tiers")||"null");if(Array.isArray(s)&&s.length==5)TI=s}catch(e){}
const tier=p=>[...TI].sort((a,b)=>b.t-a.t).find(x=>p>=x.t)||null;
const ink=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||"");if(!m)return"#fff";const n=parseInt(m[1],16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255>0.6?"#111":"#fff"};
const LK="tikkot_sonde",DAYS=7;
let ST={};try{ST=JSON.parse(localStorage.getItem(LK)||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem(LK,JSON.stringify(ST))}catch(e){alert("Impossible d'enregistrer.")}};
const isNone=u=>ST[u]&&ST[u].s=="n"&&Date.now()-ST[u].d<DAYS*864e5;
const isFav=u=>ST[u]&&ST[u].s=="f";
const shortT=t=>(String(t).split(/\s*[:\u2013\u2014]\s*|\s+-\s+/)[0].replace(/\(.*?\)/g,"").trim())||String(t);
const BG=()=>Math.max(10,Math.min(100,+$("bg").value||60))/100;
const lbc=(q,mx)=>`https://www.leboncoin.fr/recherche?text=${encodeURIComponent(q)}&category=84&sort=time&order=desc&price=min-${mx}`;
const vin=(q,mx)=>`https://www.vinted.fr/catalog/3002-video-games-and-consoles?search_text=${encodeURIComponent(q)}&order=newest_first&price_to=${mx}`;
let G=[],cur=[];
async function init(){
 for(const key of KEYS){
  try{const r=await fetch(`data/${key}/latest.json`,{cache:"no-store"});if(!r.ok)continue;const d=await r.json(),games=d.games||[];
   const v=games.filter(g=>"r" in g).map(g=>(g.r||0)+(g.f||0)).sort((a,b)=>a-b);
   const lo=v.length>=20?v[Math.floor(v.length*.4)]:-1;
   const want=(CART.has(key)?"loose":"complet");
   games.forEach(g=>{const e=(g.k||{})["FR|"+want];if(!e||!e.n)return;
    const p=e.ref||e.min;if(!p)return;
    const pop=(g.r||0)+(g.f||0);
    G.push({u:key+":"+g.id,t:g.t,c:key,p:p,min:e.min,n:e.n,unk:lo>=0&&("r" in g)&&(pop<lo||pop===0)})})
  }catch(e){}}
 const cs=$("cs");[...new Set(G.map(g=>g.c))].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=CN[c]||c;cs.appendChild(o)});
 render()}
function render(){
 const sondeMode=$("md").value=="s",mn=+$("mn").value||0,c=$("cs").value,fm=$("fm").checked,sg=$("sg").checked;
 let L=G.filter(g=>{
  if(c&&g.c!=c)return false;
  if(fm&&!g.unk)return false;
  if(!sg&&isNone(g.u))return false;
  if(sondeMode){const t=tier(g.p);if(!t||(t.k!="A"&&t.k!="S")||g.n<3)return false}
  else if(g.p<mn)return false;
  return true});
 L.sort((a,b)=>(isFav(b.u)?1:0)-(isFav(a.u)?1:0)||b.p-a.p);
 cur=L;$("ct").textContent=L.length;
 $("ls").innerHTML=L.length?L.map(g=>{const t=tier(g.p),mx=Math.max(1,Math.round(g.p*BG())),q=shortT(g.t)+" "+(CN[g.c]||g.c);
  return `<div class="row${isNone(g.u)?" none":""}${isFav(g.u)?" fav":""}">
  <div class="tl" style="background:${t?t.c:"#6b7080"};color:${t?ink(t.c):"#fff"}">${t?t.k:"·"}</div>
  <div class="inf"><div class="gt">${isFav(g.u)?"⭐ ":""}${esc(g.t)}${g.unk?" 🕵":""}</div><div class="mt">${esc(CN[g.c]||g.c)} · ${g.n} annonce${g.n>1?"s":""} eBay</div></div>
  <div class="pr">${Math.round(g.p)} €<small>cote eBay</small></div>
  <div class="act"><a class="sb lbc" href="${esc(lbc(q,mx))}" target="_blank" rel="noopener">LBC ↗<small>≤ ${mx} €</small></a><a class="sb vin" href="${esc(vin(q,mx))}" target="_blank" rel="noopener">Vinted ↗<small>≤ ${mx} €</small></a>
  <button class="no" data-a="n" data-u="${esc(g.u)}">Rien trouvé</button><button class="ok" data-a="f" data-u="${esc(g.u)}">${isFav(g.u)?"✔ Intéressant":"Intéressant"}</button></div></div>`}).join(""):'<div class="empty">Aucun jeu à sonder avec ces réglages (ou tout est grisé).</div>'}
$("ls").onclick=e=>{const b=e.target.closest("button[data-u]");if(!b)return;const u=b.dataset.u,a=b.dataset.a;
 if(a=="n"){if(isNone(u))delete ST[u];else ST[u]={s:"n",d:Date.now()}}
 else{if(isFav(u))delete ST[u];else ST[u]={s:"f",d:Date.now()}}
 sv();render()};
["md","mn","cs","fm","sg","bg"].forEach(i=>$(i).onchange=render);$("mn").oninput=render;
$("alb").onclick=()=>{const a=$("al");if(a.style.display=="block"){a.style.display="none";return}
 let L=G.filter(g=>isFav(g.u)),src="tes jeux ⭐ Intéressant";
 if(!L.length){src="les 30 jeux méconnus de rang A/S les plus chers (tu n'as encore rien marqué ⭐)";
  L=G.filter(g=>{const t=tier(g.p);return g.unk&&t&&(t.k=="A"||t.k=="S")&&g.n>=3}).sort((x,y)=>y.p-x.p).slice(0,30)}
 const lines=L.map(g=>`${shortT(g.t)} ${CN[g.c]||g.c} — max ${Math.max(1,Math.round(g.p*BG()))} €`);
 a.innerHTML=`<b>🔔 Alertes à créer sur LBC et Vinted</b> (${lines.length}, d'après ${esc(src)})<div class="sub">Sur chaque site : fais la recherche, catégorie jeux vidéo, mets le prix max, puis « Créer une alerte ».</div><pre>${esc(lines.join("\n"))||"Rien à lister."}</pre><button class="b1" id="cp">📋 Copier la liste</button>`;
 a.style.display="block";
 $("cp").onclick=()=>{navigator.clipboard.writeText(lines.join("\n")).then(()=>{$("cp").textContent="✔ Copié"})}};
init();
</script></body></html>
