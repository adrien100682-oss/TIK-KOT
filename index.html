<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snipe PS2</title>
<style>
:root{--bg:#0d0f14;--fg:#f2f3f7;--mut:#9aa0b4;--card:#171a22;--acc:#ffb020;--rare:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--fg:#14161c;--mut:#5b6175;--card:#fff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
select{background:var(--bg);color:var(--fg);border:1px solid var(--mut);border-radius:8px;padding:6px;font-size:14px}
.dash{display:flex;gap:8px}.dash div{flex:1;background:var(--bg);border-radius:10px;padding:6px 8px;font-size:11px;color:var(--mut)}
.dash b{display:block;font-size:17px;color:var(--fg)}
.note{font-size:11px;color:var(--mut)}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100%;scroll-snap-align:start;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.cover{width:min(62vw,300px);aspect-ratio:3/4.2;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800;font-size:22px;color:#fff;box-shadow:0 10px 30px #0008;border-top:14px solid #111}
.rank{position:absolute;top:10px;left:14px;color:var(--mut);font-size:13px}
.badge{background:var(--rare);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.price{font-size:34px;font-weight:800;color:var(--acc)}
.meta{color:var(--mut);font-size:13px;text-align:center}
a.btn{background:var(--acc);color:#111;padding:9px 16px;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px}
.info{display:flex;flex-direction:column;align-items:center;gap:10px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.auto button{background:var(--acc);color:#111;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.auto input[type=range]{width:110px}
@media(min-width:900px){
 .card{flex-direction:row;gap:5vw;padding:16px 4vw}
 .cover{height:min(82vh,820px);width:auto;font-size:clamp(26px,3vw,46px);padding:30px}
 .info{align-items:flex-start;width:min(34vw,460px);gap:16px}
 .price{font-size:60px}.meta{text-align:left;font-size:16px;line-height:1.5}
 .badge{font-size:15px;padding:5px 14px}a.btn{font-size:16px;padding:12px 22px}
 .rank{font-size:15px}
}
.cover{cursor:pointer}.tier{font-size:18px;font-weight:700}
body.train .card:not(.rev) .info{visibility:hidden}
body.train .card:not(.rev)::after{content:"Clique la jaquette : quel prix ?";position:absolute;bottom:14px;color:var(--mut);font-size:13px}
.quad{font-size:14px;color:var(--mut)}
#map{flex:1;min-height:0;padding:8px 12px;text-align:center;color:var(--fg)}#map svg{width:100%;height:100%;max-height:78vh}
.gt{margin:0;font-size:20px;text-align:center}@media(min-width:900px){.gt{font-size:30px;text-align:left}}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style></head><body>
<header>
 <div class="row">
  <select id="console"><option>PlayStation 2</option><option disabled>Game Boy Advance (bientôt)</option><option disabled>Super Nintendo (bientôt)</option></select>
 </div>
 <div class="auto"><button id="ab">▶ Défilement auto</button><label>Délai : <input id="sp" type="range" min="2" max="30" value="6"> <b id="sv">6</b> s</label><span>(flèches ↑ ↓ du clavier aussi)</span></div>
 <div class="auto"><label>Prix min : <input id="mn" type="range" min="0" max="500" step="5" value="0"> <b id="mv">0</b> €</label><label><input type="checkbox" id="tr"> Mode entraînement (prix masqué)</label><label><input type="checkbox" id="mp"> 🗺 Carte rareté / prix</label><label><input type="checkbox" id="ms" checked> Afficher les introuvables en ligne</label></div>
 <div class="dash"><div>Jeux listés<b id="d1">-</b></div><div>Prix moyen<b id="d2">-</b></div><div>Moyenne top 10 %<b id="d3">-</b></div></div>
 <div class="note">Jeux complets d'occasion sur eBay.fr. Prix = article + port. Référence = moyenne des 3 annonces les moins chères. Mis à jour : <span id="up">-</span></div>
</header>
<div id="feed"></div>
<div id="map" style="display:none"><svg id="sv2" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" style="color:var(--fg)"></svg><div class="note">Clique un point pour ouvrir le jeu. Échelle logarithmique.</div></div>
<script>
const tier=p=>p>=100?"💎 Pépite à prendre":p>=40?"👍 Intéressant":p>=15?"😐 Moyen":"🗑 Banal";
const $=id=>document.getElementById(id),eur=n=>Math.round(n)+" €";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?esc(u):"#";
const IMG="https://images.igdb.com/igdb/image/upload/t_cover_big/";
const col=id=>`hsl(${(id*47)%360},45%,32%)`;
const days=d=>Math.max(1,Math.round((Date.now()-new Date(d))/864e5)+1);
let G=[];
const cover=g=>`<div class="cover" onclick="this.parentNode.classList.toggle('rev')" style="background-color:${col(g.id)}${g.cover?`;background-image:url(${IMG}${g.cover}.jpg);background-size:cover;background-position:center;font-size:0`:""}">${g.cover?"":esc(g.t)}</div>`;
function build(){
 const min=+$("mn").value;
 let rows=[],miss=[];
 G.forEach(g=>{
  const L=Object.entries(g.k).filter(([k])=>k.endsWith("|complet")).map(([k,e])=>({lang:k.split("|")[0],...e}));
  const live=L.filter(e=>e.n);
  if(live.length){
   const e=live.find(x=>x.lang=="FR")||[...live].sort((a,b)=>b.n-a.n)[0];
   rows.push({g,n:e.n,ref:e.ref,min:e.min,url:e.url,sold:e.sold30||0,since:e.since,sure:e.sure,ver:e.lang,
    others:live.filter(x=>x!==e).map(x=>`${x.lang} ${eur(x.ref)} (${x.n})`).join(" · ")});
  }else{
   const e=L.filter(x=>x.last).sort((a,b)=>b.last-a.last)[0];
   if(e)miss.push({g,last:e.last,date:e.date,ver:e.lang});
  }});
 rows=rows.filter(r=>r.ref>=min).sort((a,b)=>b.ref-a.ref);
 miss=$("ms").checked?miss.filter(m=>m.last>=min).sort((a,b)=>b.last-a.last):[];
 const f=$("feed");
 const avg=a=>a.length?a.reduce((x,y)=>x+y.ref,0)/a.length:0;
 const k=Math.max(1,Math.ceil(rows.length*0.1));
 $("d1").textContent=rows.length+(miss.length?" (+"+miss.length+")":"");
 $("d2").textContent=rows.length?eur(avg(rows)):"-";$("d3").textContent=rows.length?eur(avg(rows.slice(0,k))):"-";
 const med=a=>a.length?[...a].sort((x,y)=>x-y)[Math.floor(a.length/2)]:0;
 const medP=med(rows.map(r=>r.ref)),medN=med(rows.map(r=>r.n));
 rows.forEach(r=>{const hi=r.ref>=medP,ra=r.n<=medN;r.q=hi&&ra?"🔥 Cher et rare":hi?"💰 Cher mais courant (valeur sûre)":ra?"🧩 Rare mais pas cher (à surveiller)":"📦 Courant et bon marché"});
 drawMap(rows,medP,medN);
 if(!rows.length&&!miss.length){f.innerHTML='<div class="empty">Aucun jeu pour ces filtres.</div>';return}
 const A=rows.map((r,i)=>{const d=r.since?days(r.since):0;
  const sold=r.since?`≈ ${r.sold} vente(s) estimée(s) sur 30 j`+(d<30?` (suivi depuis ${d} j)`:""):"";
  return `<section class="card"><div class="rank">#${i+1} / ${rows.length}</div>${cover(r.g)}
 <div class="info"><h2 class="gt">${esc(r.g.t)}</h2>${r.n<=3?'<span class="badge">RARE : '+r.n+' annonce'+(r.n>1?'s':'')+'</span>':''}
 <div class="price">${eur(r.ref)}</div><div class="tier">${tier(r.ref)}</div><div class="quad">${r.q}</div>
 <div class="meta">Prix de référence port inclus (version ${esc(r.ver)})<br>${r.n} annonce(s) en cours · moins chère : ${eur(r.min)}<br>${sold}${r.others?"<br>Autres versions : "+esc(r.others):""}${r.sure<r.n?"<br>Langue probable pour "+(r.n-r.sure)+" annonce(s)":""}</div>
 <a class="btn" href="${safe(r.url)}" target="_blank" rel="noopener">Voir l'annonce la moins chère</a></div></section>`});
 const B=miss.map(m=>`<section class="card"><div class="rank">Introuvable en ligne</div>${cover(m.g).replace('class="cover"','class="cover" data-miss="1"')}
 <div class="info"><h2 class="gt">${esc(m.g.t)}</h2><span class="badge" style="background:#555">INTROUVABLE</span><div class="price">?</div>
 <div class="meta">Aucune annonce pour ce filtre.<br>Dernier prix vu (version ${esc(m.ver)}) : ${eur(m.last)} le ${esc(m.date)}</div></div></section>`);
 f.innerHTML=A.concat(B).join("");
 f.scrollTop=0;
}
function drawMap(rows,medP,medN){
 const sv=$("sv2");if(!rows.length){sv.innerHTML="";return}
 const lp=rows.map(r=>Math.log(r.ref)),a=Math.min(...lp),b=Math.max(...lp)||1,mxN=Math.max(2,...rows.map(r=>r.n));
 const X=n=>60+(1-Math.log(n)/Math.log(mxN))*680,Y=p=>460-((Math.log(p)-a)/((b-a)||1))*400;
 let h=`<rect x="60" y="20" width="680" height="440" fill="none" stroke="currentColor" opacity=".25"/>
 <line x1="${X(Math.max(1,medN))}" y1="20" x2="${X(Math.max(1,medN))}" y2="460" stroke="currentColor" opacity=".4" stroke-dasharray="4"/>
 <line x1="60" y1="${Y(medP)}" x2="740" y2="${Y(medP)}" stroke="currentColor" opacity=".4" stroke-dasharray="4"/>
 <g font-size="13" fill="currentColor" opacity=".6"><text x="735" y="40" text-anchor="end">🔥 Cher et rare</text><text x="65" y="40">💰 Cher et courant</text><text x="735" y="455" text-anchor="end">🧩 Rare, pas cher</text><text x="65" y="455">📦 Courant, pas cher</text>
 <text x="400" y="486" text-anchor="middle">← plus d'annonces (courant) | moins d'annonces (rare) →</text></g>`;
 rows.forEach((r,i)=>{h+=`<g style="cursor:pointer" onclick="goTo(${i})"><circle cx="${X(r.n)}" cy="${Y(r.ref)}" r="8" fill="${col(r.g.id)}" stroke="#ffb020" stroke-width="2"/><text x="${X(r.n)+11}" y="${Y(r.ref)+4}" font-size="11" fill="currentColor">${esc(r.g.t)} · ${Math.round(r.ref)}€</text></g>`});
 sv.innerHTML=h}
function goTo(i){$("mp").checked=false;$("mp").onchange();$("feed").scrollTo({top:i*$("feed").clientHeight})}
let tm=null;const feed=$("feed");
function step(){const h=feed.clientHeight;if(feed.scrollTop+h>=feed.scrollHeight-5)feed.scrollTo({top:0,behavior:"smooth"});else feed.scrollBy({top:h,behavior:"smooth"});
 if(document.body.classList.contains("train"))setTimeout(()=>{const c=feed.children[Math.round(feed.scrollTop/feed.clientHeight)];if(c)c.classList.add("rev")},$("sp").value*500)}
function auto(on){clearInterval(tm);tm=null;$("ab").textContent=on?"⏸ Pause":"▶ Défilement auto";if(on)tm=setInterval(step,$("sp").value*1000)}
$("tr").onchange=()=>document.body.classList.toggle("train",$("tr").checked);
$("mp").onchange=()=>{const on=$("mp").checked;$("map").style.display=on?"block":"none";$("feed").style.display=on?"none":""};
$("ab").onclick=()=>auto(!tm);
$("sp").oninput=()=>{$("sv").textContent=$("sp").value;if(tm)auto(true)};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;const h=feed.clientHeight;
 if(["ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();feed.scrollBy({top:h,behavior:"smooth"})}
 if(["ArrowUp","PageUp"].includes(e.key)){e.preventDefault();feed.scrollBy({top:-h,behavior:"smooth"})}
 if(tm)auto(true)});
["ms"].forEach(i=>$(i).onchange=build);$("mn").oninput=()=>{$("mv").textContent=$("mn").value;build()};
fetch("data/latest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{G=d.games;$("up").textContent=d.updated+" · "+d.catalog_total+" jeux PAL au catalogue";build()}).catch(()=>{$("feed").innerHTML='<div class="empty">Pas encore de données : la collecte eBay doit tourner au moins une fois.</div>'});
</script></body></html>
